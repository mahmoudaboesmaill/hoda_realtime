    <radialGradient id="glassGrad" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#253852"/>
      <stop offset="60%" stop-color="#0C1726"/>
      <stop offset="100%" stop-color="#050A12"/>
