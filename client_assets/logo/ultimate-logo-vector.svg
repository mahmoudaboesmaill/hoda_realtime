  <!-- Background -->
  <rect width="1600" height="1600" fill="url(#bgGrad)"/>

  <!-- 1. Dual Symmetric Wi-Fi Signal Waves Above Roof Slopes -->
  <path d="M 526,204 A 95,95 0 0 1 620,136 M 552,220 A 62,62 0 0 1 614,175 M 578,236 A 28,28 0 0 1 607,214
           M 1074,204 A 95,95 0 0 0 980,136 M 1048,220 A 62,62 0 0 0 986,175 M 1022,236 A 28,28 0 0 0 993,214"
        fill="none" stroke="#0F223D" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 2. Smart-Home Roof (Golden Left Slope with Fin + Crimson Right Slope with Pillar + Inner Bevel Ceiling) -->
  <path d="M 800,135 L 435,342 L 538,285 L 615,172 L 580,262 L 800,135 Z" fill="url(#goldGrad)"/>
  <path d="M 800,135 L 430,345 L 448,378 L 800,180 Z" fill="url(#goldGrad)"/>
  <path d="M 800,135 L 1165,345 L 1147,378 L 1105,354 L 1105,638 L 1066,618 L 1066,332 L 800,180 Z" fill="url(#redGrad)"/>
  <path d="M 800,198 L 495,372 L 512,400 L 800,235 L 1048,376 L 1048,605 L 1072,618 L 1072,358 Z" fill="#0F223D"/>

