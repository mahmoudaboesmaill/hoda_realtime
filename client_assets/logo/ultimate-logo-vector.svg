  <path d="M 610,362 A 76,76 0 1 0 676,362" fill="none" stroke="url(#goldGrad)" stroke-width="26" stroke-linecap="round"/>
  <line x1="643" y1="322" x2="643" y2="412" stroke="url(#goldGrad)" stroke-width="26" stroke-linecap="round"/>
  <path d="M 643,502 L 643,546 Q 643,562 659,562 L 752,562" fill="none" stroke="url(#goldGrad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 596,592 L 628,592 L 628,638 L 678,638 L 678,592 L 710,592 L 710,715 L 678,715 L 678,666 L 628,666 L 628,715 L 596,715 Z" fill="url(#goldGrad)"/>

  <!-- 4. Center Axis: Golden Vertical PCB Tree + Central T-Pillar & Lower Micro-Circuit Traces -->
  <path d="M 800,542 L 800,268 M 800,322 L 828,295 L 856,295 M 800,348 L 766,315 L 736,315 M 800,425 L 826,398 L 826,356 M 800,455 L 772,428 L 772,365 M 800,502 L 828,476 L 828,452 M 778,542 L 778,526 L 766,514 L 726,514 M 822,542 L 822,512 L 848,486"
