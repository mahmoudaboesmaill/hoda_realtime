  </text>
  <text x="800" y="1376" text-anchor="middle" font-family="'Sakkal Majalla', 'Cairo', 'Traditional Arabic', sans-serif" font-weight="bold" font-size="54" fill="url(#goldGrad)">
    حلول ذكية لمستقبل أفضل
  </text>
</svg>