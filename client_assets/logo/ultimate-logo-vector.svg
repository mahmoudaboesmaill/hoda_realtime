  <g fill="url(#goldGrad)">
    <circle cx="800" cy="268" r="10.5"/><circle cx="856" cy="295" r="9.5"/><circle cx="736" cy="315" r="9.5"/>
    <circle cx="826" cy="356" r="10.5"/><circle cx="772" cy="365" r="10.5"/><circle cx="828" cy="452" r="9.5"/>
    <circle cx="726" cy="514" r="9.5"/><circle cx="848" cy="486" r="9.5"/>
  </g>
  <rect x="762" y="548" width="76" height="22" fill="#0F223D"/>
  <rect x="788" y="566" width="24" height="172" fill="#0F223D"/>
  <path d="M 784,580 L 758,608 L 740,608 M 784,618 L 768,634 L 768,678 M 784,650 L 752,650 L 752,664 M 816,580 L 834,598 L 834,622"
        fill="none" stroke="#0F223D" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#0F223D">
    <circle cx="740" cy="608" r="8"/><circle cx="768" cy="678" r="8"/><circle cx="752" cy="664" r="8"/><circle cx="834" cy="622" r="8"/>
  </g>

  <!-- 5. Right Chamber: Concentric Security Camera Lens + Visor + Arm + 'RT' -->
  <path d="M 944,502 L 944,546 Q 944,562 928,562 L 848,562" fill="none" stroke="#0F223D" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 874,368 A 96,96 0 0 1 1014,368" fill="none" stroke="#0F223D" stroke-width="15" stroke-linecap="round"/>
  <circle cx="944" cy="434" r="82" fill="#0B1829" stroke="#0F223D" stroke-width="6"/>
  <circle cx="944" cy="434" r="56" fill="url(#redGrad)"/>
  <circle cx="944" cy="434" r="32" fill="url(#glassGrad)" stroke="#050B14" stroke-width="4"/>
  <circle cx="934" cy="424" r="10.5" fill="#FFFFFF"/>
  <text x="945" y="715" text-anchor="middle" font-family="'Arial Black', 'Montserrat', sans-serif" font-weight="900" font-size="146" fill="url(#redGrad)">RT</text>

  <!-- 6. Sweeping Golden Cradling Hand + 3 Sculpted Crimson Fingers -->
  <path d="M 526,408 C 542,525 585,695 660,735 C 708,760 765,745 812,735 C 835,730 842,762 812,775 C 770,792 738,795 735,815 C 732,835 790,872 952,865 C 978,863 982,882 955,892 C 835,922 680,900 592,812 C 505,725 462,565 466,442 Z"
