  <path d="M 785,826 C 810,805 842,796 854,804 C 864,812 835,834 805,844 Z
           M 832,844 C 858,822 894,812 906,820 C 916,828 885,850 852,858 Z
           M 884,856 C 912,836 948,828 960,836 C 970,844 938,864 904,868 Z"
        fill="url(#redGrad)"/>

  <!-- 7. Bilingual Typography Block -->
  <text x="800" y="1032" text-anchor="middle" font-family="'Century Gothic', 'Montserrat', sans-serif" font-weight="bold" font-size="80">
    <tspan fill="url(#redGrad)">ELHODA </tspan><tspan fill="#0F223D">&amp; RT TECH</tspan>
  </text>
  <text x="800" y="1090" text-anchor="middle" font-family="'Bahnschrift', 'Segoe UI', sans-serif" font-weight="bold" font-size="27" letter-spacing="6.5" fill="#2C3545">
    MODERN LIGHTING &amp; SECURITY SYSTEMS
  </text>

  <!-- Divider Line + Diamond -->
  <line x1="380" y1="1126" x2="768" y2="1126" stroke="#551A2332" stroke-width="2"/>
  <line x1="832" y1="1126" x2="1220" y2="1126" stroke="#551A2332" stroke-width="2"/>
  <polygon points="800,1111 815,1126 800,1141 785,1126" fill="url(#redGrad)"/>
  <polygon points="800,1118 808,1126 800,1134 792,1126" fill="url(#goldGrad)"/>

  <!-- Arabic Branding -->
  <text x="800" y="1215" text-anchor="middle" font-family="'Sakkal Majalla', 'Cairo', 'Traditional Arabic', sans-serif" font-weight="bold" font-size="82" fill="#0F223D">
